[project]
name = "md-runner"
version = "0.1.0"
description = "Molecular dynamics toolkit for peptide simulation"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3",
  "rich>=13",
  "omegaconf>=2.0",
  "rootutils",
  "tqdm",
  "numpy",
  "openmm",
  "openmmtools",
  "mdtraj",
  "hydra-colorlog",
  "hydra-submitit-launcher",
]

[project.optional-dependencies]
boltz = ["boltz[cuda]>=2.0", "pdbfixer"]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
